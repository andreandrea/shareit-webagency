<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sistema Scollegato | ShareIt</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Titillium+Web:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .robot-container {
            width: 250px; /* Ridotto leggermente per bilanciare il testo */
            height: auto;
            margin-bottom: 30px;
        }

        .robot-svg {
            width: 100%;
            height: auto;
            animation: glowPulse 3s infinite;
        }

        /* Animazioni specifiche del tuo SVG */
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 2px #55C3EA); }
            50% { filter: drop-shadow(0 0 12px #55C3EA); }
        }

        @keyframes eyeGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .st3 { animation: eyeGlow 2s infinite; transform-origin: center; }

        .error-content h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            color: #55C3EA;
            margin: 0;
            text-shadow: 0 0 10px rgba(85, 195, 234, 0.5);
        }

        .error-content p {
            font-family: 'Titillium Web', sans-serif;
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .back-home {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid #55C3EA;
            color: #55C3EA;
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-home:hover {
            background: #55C3EA;
            color: #0f1623;
            box-shadow: 0 0 20px rgba(85, 195, 234, 0.4);
        }
    </style>
</head>
<body class="404-body">

    <div class="error-page">
        <div class="robot-container">
            <svg version="1.1" viewBox="0 0 375.1 625.2" class="robot-svg">
                <defs>
                    <linearGradient id="SVGID_1_" gradientUnits="userSpaceOnUse" x1="74.1602" y1="294.3841" x2="268.6852" y2="294.3841">
                        <stop offset="0" style="stop-color:#3B60AA"/>
                        <stop offset="0.5697" style="stop-color:#55C3EA"/>
                        <stop offset="1" style="stop-color:#3B60AA"/>
                    </linearGradient>
                    <linearGradient id="eye-gradient" gradientUnits="userSpaceOnUse" x1="126.1227" y1="271.734" x2="205.3977" y2="271.734">
                        <stop offset="0" style="stop-color:#55C3EA"/>
                        <stop offset="1" style="stop-color:#3B60AA"/>
                    </linearGradient>
                    <linearGradient id="antenna-gradient" gradientUnits="userSpaceOnUse" x1="179.3502" y1="118.8465" x2="197.4702" y2="118.8465">
                        <stop offset="0" style="stop-color:#55C3EA"/>
                        <stop offset="1" style="stop-color:#3B60AA"/>
                    </linearGradient>
                </defs>
                <path fill="#172A44" stroke="url(#SVGID_1_)" stroke-width="2" d="M75.2,195.1c0-7.7,6.3-14,14-14H245c7.6,0,15.1,3.8,22.7,11.3v201.2c0,7.7-6.3,14-14,14H89.2c-7.7,0-14-6.3-14-14V195.1z"/>
                <circle fill="url(#eye-gradient)" stroke="#55C3EA" stroke-width="3" cx="165.8" cy="271.7" r="39.6"/>
                <circle class="st3" fill="#172B45" cx="165.8" cy="271.7" r="20.4"/>
                <circle fill="url(#antenna-gradient)" stroke="#55C3EA" stroke-width="3" cx="188.4" cy="118.8" r="9.1"/>
                <path fill="#172B45" stroke="#55C3EA" stroke-width="2" d="M131.8,407.6h65.3c7.7,0,14,6.3,14,14v17.3c0,7.7-6.3,14-14,14h-62.6c-7.7,0-14-6.3-14-14v-20C120.5,411.4,124.2,407.6,131.8,407.6"/>
            </svg>
        </div>

        <div class="error-content">
            <h1>404</h1>
            <p>Oops! Il segnale si è interrotto nel cyberspazio.</p>
            <a href="index.html" class="back-home">Ricarica Sistema (Home)</a>
        </div>
    </div>

</body>
</html>
